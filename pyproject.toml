[project]
name = "solathon"
version = "2.0.0"
description = "A high-performance, easy-to-use, and feature-rich Solana SDK for Python."
license = "MIT"
authors = [{ name = "GitBolt" }]
readme = "README.md"
keywords = ["solana", "web3", "sdk", "blockchain", "crypto"]
requires-python = ">=3.11,<4.0"
dependencies = [
    "base58>=2.1.1,<3.0.0",
    "httpx>=0.28.1,<0.29.0",
    "pynacl>=1.6.2,<2.0.0",
    "solders>=0.29.0,<0.30.0",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.optional-dependencies]
qr = ["qrcode[pil]>=8.2,<9.0"]

[project.urls]
Repository = "https://github.com/GitBolt/solathon"

[tool.poetry]
include = [
    { path = "solathon/solana_pay/qr-logo.png", format = ["sdist", "wheel"] },
    { path = "CHANGELOG.md", format = ["sdist"] },
    { path = "MIGRATION.md", format = ["sdist"] },
]

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
ruff = "^0.16.6"
pip-audit = "^2.10.1"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["solathon"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
show_missing = true
fail_under = 65

[build-system]
requires = ["poetry-core>=2.4.1,<3.0.0"]
build-backend = "poetry.core.masonry.api"
